<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Vision Assessment | Georgia State University</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card">
      <img src="assets/gsu-logo.png" alt="Georgia State University Logo" class="gsu-logo" />

      <h1>Computer Vision Assessment</h1>
      <p class="subtitle">CSc 8830 - Computer Vision</p>

      <div class="module-box">
        <label for="moduleSelect">Select Module</label>

        <select id="moduleSelect">
          <option value="">Choose a module</option>
        </select>

        <button id="openModuleButton" type="button">Open Module</button>

        <p id="message" class="message"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
